[workspace]
members = [
    "crates/appcore",
    "crates/fetcher",
    "crates/indicators",
    "crates/analyzer",
    "crates/storage",
    "crates/scheduler",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stock Buddy Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utils
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"

# Internal crates
appcore = { path = "crates/appcore" }
fetcher = { path = "crates/fetcher" }
indicators = { path = "crates/indicators" }
analyzer = { path = "crates/analyzer" }
storage = { path = "crates/storage" }
scheduler = { path = "crates/scheduler" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
